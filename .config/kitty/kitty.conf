# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #

# you can choose themes from $HOME/.config/kitty/kitty-themes/
include ./kitty-themes/01-Wallust.conf

font_size 14.0 

background_opacity 0.8
confirm_os_window_close 0

# Cursor
# Animated cursor
cursor_trail 1
cursor_trail_start_threshold 0
cursor_shape block
cursor_trail_decay 0.2 0.6
cursor_blink_interval 0

# change to x11 or wayland or leave auto
linux_display_server wayland

scrollback_lines 20000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 0


# Performance tunning
input_delay 0
repaint_delay 1
sync_to_monitor no
wayland_enable_ime no


# Shortcuts
map f5 load_config_file /home/rotto-sotam/.config/kitty/kitty.conf
map ctrl+shift+b close_other_windows_in_tab
map ctrl+shift+s close_window

# Layouts
enabled_layouts splits

map ctrl+shift+o launch --location=hsplit
map ctrl+shift+e launch --location=vsplit


# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
